{n:['主导型','Dominance'],role:['开拓者','The Pathfinder'],tag:['果断 · 目标 · 行动','Decisive · Focused · Active'],core:['你通常先关注事情能否向前推进，喜欢明确目标、独立决策与直接交流。你可能愿意承担挑战，也希望讨论尽快转化为行动。','You often focus first on moving things forward. Clear goals, independent decisions and direct conversation appeal to you. You may welcome a challenge and want discussion to lead to action.'],strength:['明确重点、推动决定、面对困难不轻易退缩。团队停滞时，你可能愿意承担责任、发起尝试。','Clarifying priorities, driving decisions and tackling obstacles. When a team stalls, you may take ownership and initiate action.'],need:['具有挑战的目标、适当的决定权，以及能看见成果的工作。','Challenging goals, suitable decision authority and work with visible outcomes.'],stress:['进度缓慢、失去决定权、层层审批，可能让你感到受限制。','Slow progress, limited control or layers of approval may feel restrictive.'],reaction:['压力或冲突中，你可能更直接、更急切，容易把讨论变成谁对谁错。请把这当作观察线索，而非必然反应。','Under pressure or conflict, you may become more direct or urgent and turn discussion into a contest. Treat this as a reflection prompt, not a prediction.'],overuse:['果断用得过多，可能变成抢着决定；重视结果用得过多，可能忽略他人的参与和执行细节。','Decisiveness can become premature decisions. A strong outcome focus can overlook participation or delivery details.'],talk:['先说结论与目标，再给选择、风险及建议。沟通可以简短，但仍要让对方表达不同意见。','Lead with the outcome, then options, risks and a recommendation. Be concise while making room for disagreement.'],dont:['反复绕圈、只有问题没有方案，或用模糊承诺代替具体行动。','Avoid circular discussion, problems without options or vague promises instead of concrete actions.'],leader:['可用清楚目标激发行动；授权时同时确认资源和能力，避免默认每个人都能跟上你的速度。','Use clear goals to prompt action. Check resources and capability when delegating instead of assuming everyone shares your pace.'],team:['在方向和推进上贡献力量，同时主动邀请负责细节与协作的伙伴补位。','Contribute direction and momentum, and invite teammates to cover detail and coordination.'],action:['下一次作决定前，先问两个人：“你看到我遗漏了什么？”然后再确定行动。','Before your next decision, ask two people: “What might I be missing?” Then choose your action.'],line:['“目标是什么？我建议 A 方案，原因是……你看到什么风险？”','“What is the target? I recommend option A because… What risks do you see?”']},
{n:['影响型','Influence'],role:['连接者','The Connector'],tag:['热情 · 表达 · 人际','Enthusiastic · Expressive · Social'],core:['你通常通过交流探索可能性，喜欢分享想法、认识伙伴与营造积极气氛。人际互动和共同参与，可能给你带来能量。','You often explore possibilities through conversation. Sharing ideas, meeting people and creating positive energy may appeal to you. Interaction and shared participation can energize you.'],strength:['激发参与、表达愿景、建立关系。在新项目需要支持时，你可能善于让大家看见值得尝试的地方。','Generating participation, expressing a vision and building relationships. You may help people see why a new initiative is worth exploring.'],need:['表达与互动的空间、正向反馈，以及与他人共同参与的机会。','Room to express yourself, constructive recognition and opportunities to participate with others.'],stress:['长时间孤立、缺少互动，或需要给别人负面反馈，可能增加你的负担。','Long periods of isolation, little interaction or giving difficult feedback may feel taxing.'],reaction:['冲突时，你可能更急着解释自己的感受，或讲得比听得多。放慢一点，先确认事实与对方的意思。','In conflict, you may rush to explain feelings or talk more than listen. Slow down to check facts and understand the other person.'],overuse:['热情用得过多，可能承诺超过可完成的范围；关注新点子过多，可能让收尾跟进不足。','Enthusiasm can become overcommitment. A focus on new ideas can leave follow-through unfinished.'],talk:['先建立友善交流，再说明有意义的目标；让对方参与讨论，最后把决定写成清楚的行动。','Start warmly and explain a meaningful goal. Invite discussion, then put decisions into clear written actions.'],dont:['冷淡打断、完全不给表达空间，或只谈细节却不解释整体意义。','Avoid cold interruptions, shutting down expression or giving detail without the overall purpose.'],leader:['可以用愿景鼓励团队，但需要配合明确优先级、负责人、期限和跟进记录。','Encourage the team with a vision, supported by clear priorities, owners, deadlines and follow-up records.'],team:['在关系与表达上贡献力量，也为伙伴留下说话空间，核对自己承诺的事项。','Contribute connection and expression, while leaving others space to speak and checking your commitments.'],action:['每次会议结束，用一分钟写下三件事：谁负责、何时完成、怎样确认完成。','End each meeting by recording three things: the owner, the due date and how completion will be checked.'],line:['“这个想法值得尝试。我们先做哪一步？由谁负责，什么时候一起看结果？”','“This idea is worth trying. What is the first step, who owns it and when will we review it?”']},
{n:['稳健型','Steadiness'],role:['守护者','The Supporter'],tag:['耐心 · 支持 · 稳定','Patient · Supportive · Steady'],core:['你通常重视可靠的合作关系、稳定节奏与相互支持。你可能愿意耐心听别人说完，并让团队在变化中保持配合。','You often value dependable cooperation, a steady pace and mutual support. You may listen patiently and help a team stay coordinated through change.'],strength:['倾听、持续支持、稳定配合。需要长期跟进与互信的合作中，你可能让人感到踏实。','Listening, sustained support and consistent cooperation. You may bring reassurance to work requiring ongoing follow-up and trust.'],need:['可信赖的关系、清楚指引，以及适应变化的时间和支持。','Trustworthy relationships, clear guidance, and time and support to adjust to change.'],stress:['突然变化、当面冲突、缺乏指引，或被要求立即作重大决定，可能让你不舒服。','Sudden change, confrontation, unclear guidance or pressure for an immediate major decision may feel uncomfortable.'],reaction:['为了维持和谐，你可能先退让或不说出顾虑；问题因此可能延后才被看见。','To preserve harmony, you may give way or hold back concerns, so issues may surface later.'],overuse:['支持他人用得过多，可能忽略自己的需求；维持稳定用得过多，可能错过需要改变的时机。','Supporting others can crowd out your own needs. Maintaining stability can delay a necessary change.'],talk:['用平和语气说明原因、步骤和对人的影响。给对方时间提问，并主动询问尚未说出的顾虑。','Explain reasons, steps and effects on people calmly. Allow questions and ask about concerns that have not been voiced.'],dont:['突然下达改变、咄咄逼人地催促，或把沉默直接当成同意。','Avoid surprise changes, forceful pressure or treating silence as agreement.'],leader:['可以建立安全与互信，也需要及时处理绩效问题，明确责任并练习表达不同意见。','Build safety and trust while addressing performance issues promptly, clarifying responsibility and voicing disagreement.'],team:['在支持与持续跟进上贡献力量，同时练习提出自己的判断、需求与工作边界。','Contribute support and continuity while stating your judgment, needs and workload boundaries.'],action:['本周选择一件小事，明确说出：“我的建议是……我需要的支持是……”','This week, choose one small issue and say: “My recommendation is… The support I need is…”'],line:['“我愿意支持这个安排，不过我担心……我们可以怎样调整，让事情更顺利？”','“I want to support this plan, and I am concerned about… How can we adjust it to work better?”']},
{n:['审慎型','Conscientiousness'],role:['洞察者','The Analyst'],tag:['逻辑 · 标准 · 准确','Logical · Precise · Analytical'],core:['你通常先确认依据、要求与风险，重视准确和质量。你可能喜欢有条理地分析，在作出判断前把关键问题想清楚。','You often check evidence, requirements and risks first, valuing accuracy and quality. You may prefer orderly analysis and clarity on key issues before deciding.'],strength:['分析问题、识别漏洞、明确标准。方案需要检验和质量控制时，你可能发现被忽略的细节。','Analyzing problems, spotting gaps and clarifying standards. You may notice overlooked details when a plan needs checking or quality control.'],need:['明确的质量要求、可信资料，以及独立思考和运用专业知识的空间。','Clear quality criteria, credible information and space to think independently and apply expertise.'],stress:['信息不确定、未经评估的风险、公开犯错，或缺乏思考空间，可能带来压力。','Uncertain information, unexamined risks, public errors or little thinking space may create pressure.'],reaction:['冲突时，你可能不断追问依据、强调错误，或退到独自分析。别人可能因此感觉被挑剔或疏远。','In conflict, you may press for evidence, emphasize errors or withdraw to analyze. Others may experience this as criticism or distance.'],overuse:['追求准确用得过多，可能拖延决定；坚持标准用得过多，可能忽略情境和别人的感受。','Accuracy can become delayed decisions. Strong standards can overlook context or other people’s feelings.'],talk:['提供清楚的事实、比较依据和要求，留出思考时间；同时约定决策期限与足够好的标准。','Provide facts, comparison criteria and requirements. Allow thinking time and agree on a decision deadline and a good-enough standard.'],dont:['夸大保证、资料混乱、只凭感觉催促决定，或把合理提问当成不合作。','Avoid inflated guarantees, disorganized information, pressure based only on feelings or treating reasonable questions as resistance.'],leader:['可以建立流程与质量标准，也要允许试验，区分必要检查和可以授权的细节。','Build processes and quality standards while allowing experiments and distinguishing essential checks from delegable detail.'],team:['在分析与质量上贡献力量，同时把发现的问题转成可执行建议，确认伙伴是否理解。','Contribute analysis and quality checks while turning issues into practical suggestions and checking shared understanding.'],action:['为下一个决定设定时间点，写明：哪些信息必须有，哪些信息可以行动后再补。','For your next decision, set a deadline and list the information you must have versus what can be learned after acting.'],line:['“依据现有资料，我建议……主要风险是……我们在什么条件下可以先试行？”','“Based on the available evidence, I recommend… The main risk is… Under what conditions could we run a trial?”']}

function home(){$('app').innerHTML=`<div class="hero fade"><section><span class="pill"><span class="dot"></span>${T('认识自己，从一场小冒险开始','A LITTLE ADVENTURE IN SELF-DISCOVERY')}</span><h1>${T('解锁你的<br><span class="accent">行为风格。</span>','Unlock your<br><span class="accent">way of being.</span>')}</h1><p class="lead">${T('你是推动行动的开拓者，还是温暖可靠的守护者？走过四个探索关卡，发现你在沟通与合作中的独特倾向。','A bold pathfinder or a steady supporter? Travel through four chapters and discover your own way of communicating and collaborating.')}</p><div class="mode-grid"><button class="mode ${mode===16?'active':''}" data-mode="16"><span class="tick">${mode===16?'◉':'○'}</span><b>${T('轻量冒险','Quick adventure')}</b><small>${T('16 组 · 约 4–6 分钟','16 groups · About 4–6 min')}</small></button><button class="mode ${mode===28?'active':''}" data-mode="28"><span class="recommend">${T('更多情境','MORE CONTEXTS')}</span><span class="tick">${mode===28?'◉':'○'}</span><b>${T('完整旅程','Full journey')}</b><small>${T('28 组 · 约 8–12 分钟','28 groups · About 8–12 min')}</small></button></div><div class="actions"><button class="primary" id="start">${T(count()?'继续我的旅程':'开启探索之旅',count()?'Continue my journey':'Begin my quest')} <span>→</span></button>${finished?`<button class="secondary" id="view-report">${T('我的报告','My report')} ↗</button>`:`<button class="plain" id="learn">${T('先认识 DISC','Meet DISC first')} ↗</button>`}</div><div class="mini-stat"><span><strong>4</strong>${T('行为维度','behaviour dimensions')}</span><span><strong>2</strong>${T('语言自由切换','languages to explore')}</span><span><strong>0</strong>${T('正确或错误答案','right or wrong answers')}</span></div></section><div class="orbit" aria-hidden="true"><span class="spark">✧</span><div class="hero-disc">${keys.map((k,j)=>`<div class="creature-tile ${k.toLowerCase()}-bg"><span class="letter">${k}</span>${char(j)}</div>`).join('')}</div><div class="float-label">✦ ${T('每一种风格，都有价值','Every style brings value')}</div><div class="float-label bottom">✓ ${T('不是标签，是新的理解','Less labeling. More understanding.')}</div><span class="spark two">✦</span></div></div><div class="journey-strip">${chapters.map((c,j)=>`<div><span class="route-dot">0${j+1}</span><span><b>${c[en?1:0]}</b><small>${T('解锁一段探索','Unlock a chapter')}</small></span></div>`).join('')}</div><section><div class="section-head"><div><div class="eyebrow">MEET THE FOUR STYLES</div><h2>${T('四种倾向，无限种你。','Four tendencies. A unique you.')}</h2></div><button class="link-btn" id="guide-link">${T('查看风格图鉴','Explore the guide')} ↗</button></div><div class="style-grid">${P.map((p,j)=>`<button class="style-card" style="--tone:${tones[j]}" data-style="${j}"><span class="style-letter" style="color:${tones[j]}">${keys[j]} / ${p.n[1].toUpperCase()}</span>${char(j)}<h3>${B(p.role)}</h3><p>${B(p.tag)}</p></button>`).join('')}</div></section><div class="info-banner"><span>ⓘ</span><p>${T('探索的是行为偏好，而非能力高低。题目为原创，尚未进行信效度与常模验证；趣味角色是本网站的视觉比喻，不是官方 DISC 类型名称。','Explore preferences, not ability. Original items have not been validated or normed. Playful characters are this site’s visual metaphors, not official DISC type names.')}</p></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{let m=+b.dataset.mode;if(m===mode)return;if(count()>0&&!confirm(T('切换模式会清除当前旅程的答案。继续？','Changing modes clears this journey’s answers. Continue?')))return;mode=m;answers=Array.from({length:28},()=>({m:null,l:null}));idx=0;finished=false;completedAt=null;stash();home()});$('start').onclick=()=>go(count()?'test':'setup');if($('view-report'))$('view-report').onclick=()=>go('report');if($('learn'))$('learn').onclick=()=>openGuide(0);$('guide-link').onclick=()=>openGuide(0);document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>openGuide(+b.dataset.style))}
function openGuide(j=0){returnView=view==='guide'?returnView:view;learnStyle=j;go('guide')}
function setup(){$('app').innerHTML=`<section class="onboard fade"><button class="back" id="back">← ${T('返回起点','Back to start')}</button><div class="panel"><div class="eyebrow">YOUR QUEST BEGINS HERE</div><h2>${T('准备好，遇见真实的自己。','Ready to meet the everyday you?')}</h2><p class="muted">${mode} ${T('组情境，每一组都是一次小选择。','groups. One small choice at a time.')}</p><div class="rules"><div class="rule"><span>1</span><p>${T('每组有四句话，选一句「最像我」、一句「最不像我」。','Each group has four statements. Pick one most like you and one least like you.')}</p></div><div class="rule"><span>2</span><p>${T('回想平时工作中的自己，不是你认为别人期待的样子。','Think of your usual behavior at work, rather than what others expect of you.')}</p></div><div class="rule"><span>3</span><p>${T('不用追求好答案；每种选择都没有对错。进度奖励与风格分数无关。','There are no good or bad answers. Progress rewards have no effect on style scores.')}</p></div></div><label class="name-label" for="name">${T('给这段旅程一个名字（可选）','Name your journey (optional)')}</label><input type="text" id="name" maxlength="60" placeholder="${T('你的名字或昵称','Your name or nickname')}" value="${esc(name)}"><p class="field-note">${T('只保存在这台设备，不会上传测试答案。','Stored on this device only. Answers are not uploaded.')}</p><button class="primary" id="begin" style="width:100%;margin-top:12px">${T('出发，进入第一关','Let’s go · Chapter one')} →</button></div></section>`;$('back').onclick=()=>go('home');$('begin').onclick=()=>{name=$('name').value.trim();idx=0;stash();go('test')}}
function mapHtml(current){let per=mode/4;return `<aside class="side"><div class="eyebrow">YOUR ADVENTURE MAP</div><div class="map">${chapters.map((c,j)=>{let done=answers.slice(j*per,(j+1)*per).every(complete);return `<div class="map-stop ${j===current?'current':done?'done':''}"><span class="map-icon">${done?'✓':j+1}</span><div><b>${c[en?1:0]}</b><small>${T('关卡','Chapter')} ${j+1} / 4</small></div></div>`}).join('')}</div><div class="companion">${char(4)}<p>${T('慢慢来，选平常的你。<br>每一步都算数。','Take your time.<br>Choose the everyday you.')}</p></div></aside>`}
function test(){let a=answers[idx],n=count(),chapter=Math.floor(idx/(mode/4)),order=[0,1,2,3].map((_,j)=>(j+idx)%4);$('app').innerHTML=`<div class="mission-layout fade">${mapHtml(chapter)}<section class="mission"><div class="progress-head"><span>CHAPTER 0${chapter+1} / 04</span><span>${n} / ${mode} ${T('组完成','completed')} · ${Math.round(n/mode*100)}%</span></div><div class="progress"><i style="width:${n/mode*100}%"></i></div><div class="eyebrow">${chapters[chapter][en?1:0]}</div><h2>${T('这一次，哪个更像你？','Which feels more like you?')}</h2><div class="question-title"><span class="qnum">${String(idx+1).padStart(2,'0')}</span><h3>${T('没有标准答案，只有你的选择。','No right answer. Just your choice.')}</h3></div><p class="instructions">${T('选一项最像、一项最不像。两项不能是同一句。','Choose one most and one least like you. They must be different.')}</p><div class="option-head"><span>${T('日常工作中的我……','At work, I…')}</span><span>${T('最像我','Most like me')}</span><span>${T('最不像我','Least like me')}</span></div>${order.map(j=>`<div class="option-row ${a.m===j||a.l===j?'selected':''}"><div class="statement">${raw[idx][j][en?1:0]}</div>${['m','l'].map(k=>`<label class="choice ${k==='l'?'least':''}"><input type="radio" name="${k}" value="${j}" aria-label="${esc(raw[idx][j][en?1:0]+' — '+(k==='m'?T('最像我','Most like me'):T('最不像我','Least like me')))}" ${a[k]===j?'checked':''}><span class="radio-mark" aria-hidden="true">${k==='m'?'✓':'−'}</span></label>`).join('')}</div>`).join('')}<div class="selection-status" id="status" role="status">${complete(a)?T('✓ 两项已选好，可以前往下一步。','✓ Both selected. Ready for the next step.'):T('请选择最像你与最不像你的描述。','Select your most and least like you statements.')}</div><div class="bottom-actions"><button class="plain" id="prev">← ${T(idx?'上一组':'返回首页',idx?'Previous':'Home')}</button><button class="primary" id="next" ${complete(a)?'':'disabled'}>${idx===mode-1?T('揭晓我的风格','Reveal my profile'):T('下一步','Next step')} →</button></div><p class="field-note">◈ ${T('随时可休息；当前浏览器会保留进度。','Take a break any time. This browser keeps your progress.')}</p></section></div>`;document.querySelectorAll('.choice input').forEach(el=>el.onchange=()=>{a[el.name]=+el.value;let other=el.name==='m'?'l':'m';if(a[other]===+el.value)a[other]=null;finished=false;completedAt=null;stash();document.querySelectorAll('.choice input').forEach(r=>r.checked=a[r.name]===+r.value);document.querySelectorAll('.option-row').forEach(row=>{const j=+row.querySelector('input').value;row.classList.toggle('selected',a.m===j||a.l===j)});$('next').disabled=!complete(a);$('status').textContent=complete(a)?T('✓ 两项已选好，可以前往下一步。','✓ Both selected. Ready for the next step.'):T('请选择另一项描述，最像与最不像不能相同。','Select a different statement for the other choice.');const ph=document.querySelector('.progress-head span:last-child');ph.textContent=`${count()} / ${mode} ${T('组完成','completed')} · ${Math.round(count()/mode*100)}%`;document.querySelector('.progress i').style.width=count()/mode*100+'%'});$('prev').onclick=()=>{if(idx){idx--;stash();go('test')}else go('home')};$('next').onclick=()=>{if(!complete(a))return;if(idx===mode-1){if(!allDone()){idx=answers.slice(0,mode).findIndex(a=>!complete(a));go('test');return}finished=true;completedAt=new Date().toISOString();stash();go('report');celebrate();return}let end=(idx+1)%(mode/4)===0;idx++;stash();if(end){milestone=chapter+1;go('milestone');celebrate()}else go('test')}}
function checkpoint(){$('app').innerHTML=`<section class="interlude fade"><div class="eyebrow">CHAPTER COMPLETE</div><div class="achievement">${char(4)}<span class="star">✦</span></div><span class="pill">${T('探索徽章','Explorer badge')} ${milestone} / 4</span><h2 style="margin-top:20px">${T('又走近自己一步。','One step closer to understanding you.')}</h2><p class="muted">${T('你已完成','You have completed')} ${count()} / ${mode} ${T('组情境。下一站，继续探索平时的你。','groups. Next stop: more of the everyday you.')}</p><div class="unlock-list" aria-hidden="true">${chapters.map((_,j)=>`<i class="unlock-item ${j<milestone?'on':''}"></i>`).join('')}</div><p class="small">${T('徽章只记录完成进度，不代表分数高低或能力。','Badges track completion, not style scores or ability.')}</p><button class="primary" id="continue">${T('进入下一关','Enter the next chapter')} →</button></section>`;$('continue').onclick=()=>go('test')}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let d=document.createElement('div');d.className='confetti';d.setAttribute('aria-hidden','true');d.innerHTML=Array.from({length:24},(_,j)=>`<i style="left:${(j*37)%100}%;background:${tones[j%4]};animation-delay:${j%5*.08}s;rotate:${j*17}deg"></i>`).join('');document.body.append(d);setTimeout(()=>d.remove(),3200)}
function score(){let most=[0,0,0,0],least=[0,0,0,0];answers.slice(0,mode).forEach(a=>{most[a.m]++;least[a.l]++});let net=most.map((v,j)=>v-least[j]);return{most,least,net,index:net.map(v=>Math.round((v+mode)/(mode*2)*100))}}
function detailBlock(label,title,body){return `<article class="detail-block"><div class="detail-label">${label}</div><h3>${title}</h3><p>${body}</p></article>`}

if(k==='people')return `<div class="detail-grid">${detailBlock('01 / COMMUNICATION',T('和这个倾向的人怎么谈','How to communicate with this tendency'),B(p.talk))}${detailBlock('02 / FRICTION',T('容易产生摩擦的方式','Approaches that may create friction'),B(p.dont))}${detailBlock('03 / LEADERSHIP',T('带团队时的提醒','A leadership reminder'),B(p.leader))}${detailBlock('04 / TEAMWORK',T('团队合作中的练习','A teamwork practice'),B(p.team))}</div><div class="info-banner">${T('以下应用建议由本网站结合行为框架编写，需与真实需求、能力和经验一起讨论；不用于决定谁能当领导、谁适合某种岗位。','These site-authored applications should be discussed alongside real needs, ability and experience. They do not determine leadership potential or job suitability.')}</div>`;
return `<div class="detail-grid">${detailBlock('01 / THIS WEEK',T('本周的小任务','Your practice this week'),B(p.action))}${detailBlock('02 / TRY SAYING',T('试着这样表达','Try saying this'),`<span class="quote">${B(p.line)}</span>`)}${detailBlock('03 / CHECK WITH SOMEONE',T('找熟悉你的人核对','Check with someone who knows you'),T('把报告给一位合作过的伙伴看。问：“哪一项像我？哪一项不太像？你能举一个例子吗？”','Show the report to a colleague. Ask: “What fits? What does not? Can you give me an example?”'))}${detailBlock('04 / KEEP FLEXIBLE',T('练习调整，而非换一个标签','Practice flexibility, not a new label'),T('一次只选择一个行为来练习。下周回顾：它有没有让沟通更清楚、让合作更顺利？','Choose one behavior to practice. Next week, check whether it made communication clearer or collaboration smoother.'))}</div>`}
const tabItems=[['self','认识自己','Understand'],['pressure','压力与盲点','Pressure'],['people','沟通与团队','People'],['action','成长任务','Practice'],['method','数据与依据','Data & sources']];
function report(){if(!allDone()){go('test');return}let r=score(),max=Math.max(...r.net),tops=keys.map((k,j)=>j).filter(j=>r.net[j]===max),lead=tops[0],tie=tops.length>1,rank=[0,1,2,3].sort((a,b)=>r.net[b]-r.net[a]),second=rank[1],seconds=rank.filter(j=>r.net[j]===r.net[second]),near=!tie&&r.net[lead]-r.net[second]<=2;let label=tie?T('并列的行为倾向','Shared leading tendencies'):B(P[lead].role);$('app').innerHTML=`<section class="report-hero fade"><div><div class="eyebrow">QUEST COMPLETE / YOUR BEHAVIOUR STORY</div><span class="pill">✦ ${T('旅程完成 · 4 枚探索徽章','Journey complete · 4 explorer badges')}</span><h1>${esc(name)?esc(name)+'，':''}${T('遇见你的','Your style:')}<br>${label}${tie?'':'.'}</h1><p>${tie?T('你的最高净分出现并列。多种倾向同时突出很正常；请结合情境理解，而非强行选一个标签。','Your highest net scores are tied. Several tendencies can stand out together. Consider the context rather than forcing a single label.'):B(P[lead].core)}</p><div class="report-meta">${completedAt?new Date(completedAt).toLocaleDateString(en?'en-MY':'zh-CN'):T('本次探索','This journey')} · ${mode} ${T('组情境','groups')} · ${T('原创自我探索版','Original self-reflection edition')}</div></div><div>${char(tie?4:lead)}</div></section><div class="report-top"><section class="panel"><div class="small-title">YOUR DISC SNAPSHOT</div><h3 style="margin-top:8px">${T('你的四项倾向指数','Your four tendency indices')}</h3><div class="bars">${keys.map((k,j)=>`<div class="barrow"><b style="color:${tones[j]}">${k}</b><div class="bar-track"><div class="bar-fill" style="width:${r.index[j]}%;background:${tones[j]}"></div></div><b>${r.index[j]}</b></div>`).join('')}</div><p class="small">${T('指数范围 0–100，各项不相加为 100。50 表示该维度的最像与最不像次数相同，不是人群平均值或百分位。','Indices range 0–100 and do not sum to 100. 50 means equal most/least selections, not a population average or percentile.')}</p></section><section class="panel"><div class="small-title">READ THE PATTERN</div><h3 style="margin-top:8px">${T('比一个字母，多了解一点','More than a single letter')}</h3><div class="insight"><b>${T('主要倾向','Leading tendency')} · ${tops.map(j=>keys[j]).join(' / ')}</b><span class="small">${tie?T('最高净分相同，报告将并列呈现，不推断唯一主型。','The top net score is tied; no single primary type is inferred.'):B(P[lead].tag)}</span></div>${!tie?`<div class="insight"><b>${T('本次第二顺位','Second-ranked here')} · ${seconds.map(j=>keys[j]).join(' / ')}</b><span class="small">${near?T('前两项净分只差 1–2 分，排序对少量答案敏感，请同时阅读这两项。','The top two net scores are only 1–2 points apart. A few choices could change the order; read both.'):T('第二顺位是本次作答的相对排序，不等于经过验证的混合类型。','This is a relative rank from these answers, not a validated blended type.')}</span></div>`:''}<p class="small">${T('较低指数表示在这些成组选项中较少选它为最像、或较常选它为最不像，不表示缺乏这项能力。','A lower index means relatively fewer “most” or more “least” choices in these groups, not a lack of ability.')}</p></section></div><div class="report-options no-print"><button class="primary" id="print">${T('保存 / 打印 PDF','Save / Print PDF')} ↗</button><button class="secondary" id="download">${T('下载数据','Download data')} ↓</button><button class="plain" id="review">${T('检查答案','Review answers')}</button><button class="plain" id="reset">${T('重新探索','Restart')}</button></div><div class="section-head" style="margin-top:38px"><div><div class="eyebrow">YOUR FIELD GUIDE</div><h2>${T('读懂自己，也练习不同。','Understand yourself. Practice flexibility.')}</h2></div></div>${tie?`<p class="small">${T('并列倾向，请选择下方字母分别阅读。','For tied tendencies, choose each letter below to read more.')}</p>`:''}<div class="report-options no-print" style="margin:10px 0"><span class="small">${T('查看维度：','Read dimension:')}</span>${keys.map((k,j)=>`<button class="tab ${learnStyle===j?'active':''}" data-report-style="${j}" aria-pressed="${learnStyle===j}">${k} · ${B(P[j].n)}</button>`).join('')}</div><div class="tabs" role="tablist" aria-label="${T('解读内容','Report sections')}">${tabItems.map(x=>`<button class="tab ${tabKey===x[0]?'active':''}" role="tab" aria-selected="${tabKey===x[0]}" aria-controls="tab-content" data-tab="${x[0]}">${x[en?2:1]}</button>`).join('')}</div><section id="tab-content" class="screen-only" role="tabpanel">${tabKey==='method'?method(r):`<div class="learn-title">${char(learnStyle)}<div><span class="small-title">${keys[learnStyle]} / ${P[learnStyle].n[1]}</span><h2>${B(P[learnStyle].n)}</h2><p class="small" style="margin:0">${B(P[learnStyle].tag)}</p></div></div>${personContent(learnStyle,tabKey)}<p class="small" style="margin-top:20px">${T('基于 DISC 培训框架的倾向描述，并非对你的逐条断言。请保留符合实际的部分，用真实经历核对。','These are tendencies described in DISC training frameworks, not individual predictions. Keep what fits and check it against real experiences.')}</p>`}</section><div class="print-only">${tops.map(j=>`<h2>${keys[j]} · ${B(P[j].n)}</h2>${['self','pressure','people','action'].map(k=>personContent(j,k)).join('')}`).join('')}${method(r)}</div><div class="info-banner"><span>ⓘ</span><p>${T('本工具未经信效度验证，不提供人格诊断、能力排名或职业适任判断。它不是 Everything DiSC、TTI 或 123test 的官方测评。','This tool is not validated and does not diagnose personality, rank ability or determine job fit. It is not an official Everything DiSC, TTI or 123test assessment.')}</p></div>`;
$('print').onclick=()=>window.print();$('download').onclick=()=>{let blob=new Blob([JSON.stringify({assessment:'DISC QUEST original educational self-reflection v2',name,completedAt,groups:mode,...r,leading:tops.map(j=>keys[j]),answers:answers.slice(0,mode),method:'Most +1; least -1. Index=round((net+N)/(2*N)*100). Not normed or validated.'},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='DISC-Quest-Report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('review').onclick=()=>{idx=0;go('test')};$('reset').onclick=reset;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tabKey=b.dataset.tab;report()});document.querySelectorAll('[data-report-style]').forEach(b=>b.onclick=()=>{learnStyle=+b.dataset.reportStyle;report()});}
function reset(){if(!confirm(T('清除本机保存的名字、答案与报告，重新开始？','Clear the name, answers and report saved on this device and start again?')))return;answers=Array.from({length:28},()=>({m:null,l:null}));idx=0;name='';finished=false;completedAt=null;try{localStorage.removeItem('disc-quest-v2');localStorage.removeItem('disc-lab-v1')}catch(e){}go('home')}
function sourceLinks(){return `<div class="source-list"><a href="https://www.everythingdisc.com/what-is-disc/" target="_blank" rel="noopener">Everything DiSC · The model, four dimensions & 12 styles ↗</a><a href="https://www.everythingdisc.com/how-disc-works/" target="_blank" rel="noopener">Everything DiSC · Reading the map & behavioral flexibility ↗</a><a href="https://www.everythingdisc.com/the-science-behind-disc/" target="_blank" rel="noopener">Everything DiSC · Research, reliability & validity ↗</a><a href="https://www.discprofile.com/disc-styles" target="_blank" rel="noopener">DiSCprofile · D, i, S, C style descriptions ↗</a><a href="https://images.ttisi.com/wp-content/uploads/2025/06/12110356/MarketingShortenedReport_DISC.pdf" target="_blank" rel="noopener">TTI Success Insights · Sample report & natural/adapted styles (PDF) ↗</a><p>${T('资料核对：2026-11-15。以上机构是不同测评产品的提供者或销售培训方；资料用于解释框架，不表示他们认可或验证了本工具。','Sources checked: 15 Nov 2026. These organizations provide or distribute different assessment products. Their materials explain the frameworks; they do not endorse or validate this tool.')}</p></div>`}
function method(r){return `<div class="panel"><h3>${T('透明计分，谨慎解读','Transparent scoring, careful interpretation')}</h3><p class="small">${T(`每组四句分别映射到 D、I、S、C，展示顺序轮换。最像 +1、最不像 −1，其余 0。共 ${mode} 组，每项净分范围 −${mode} 至 +${mode}。`,`Each group maps one statement to D, I, S and C, with rotating display order. Most = +1, least = −1, others = 0. Across ${mode} groups, each net score ranges from −${mode} to +${mode}.`)}</p><p class="small"><b>${T('倾向指数','Tendency index')} = round((net + ${mode}) / ${mode*2} × 100)</b></p><div class="table-wrap"><table><thead><tr><th>${T('维度','Dimension')}</th><th>${T('最像次数','Most')}</th><th>${T('最不像次数','Least')}</th><th>${T('净分','Net')}</th><th>${T('指数','Index')}</th></tr></thead><tbody>${keys.map((k,j)=>`<tr><td>${k}</td><td>${r.most[j]}</td><td>${r.least[j]}</td><td>${r.net[j]}</td><td>${r.index[j]}</td></tr>`).join('')}</tbody></table></div><details open><summary>${T('这些分数不代表什么？','What these scores do not mean')}</summary><p>${T('它们不是百分位、人口常模或能力分数。成组选项使四项彼此有关，净分总和为 0。16 组与 28 组不具经过验证的等值关系，不宜把两次分数当成准确的成长测量。','They are not percentiles, norms or ability ratings. Grouped choices make dimensions interdependent, with net scores summing to zero. The 16- and 28-group modes are not validated as equivalent; differences are not a calibrated measure of growth.')}</p></details><details><summary>${T('为什么不直接输出官方 12 型？','Why not assign an official 12-style type?')}</summary><p>${T('Everything DiSC 的 12 风格来自其专有测量和圆形模型，不能用本工具前两项分数直接复刻。我们提供图鉴用于学习，报告只显示相对倾向与并列情况。','Everything DiSC’s 12 styles use its own measurement and circular model. They cannot be reproduced by simply taking our top two scores. The guide teaches those concepts; this report shows relative tendencies and ties only.')}</p></details><details><summary>${T('为什么没有自然 / 适应双图？','Why no natural / adapted graphs?')}</summary><p>${T('TTI 的报告区分自然与适应风格。这需要相应的测评设计和解释规则；我们没有据此把“最像”与“最不像”分别假定为真实或伪装的自己。','TTI distinguishes natural and adapted styles using its assessment design. We do not assume that most/least answers separately represent a true or a masked self.')}</p></details><details><summary>${T('隐私与本机记录','Privacy and local records')}</summary><p>${T('姓名可留空。答案、进度和完成日期仅在此浏览器保存，不上传服务器。使用“重新探索”可清除本工具的本机记录；下载的报告需自行删除。','The name is optional. Answers, progress and completion date stay in this browser and are not uploaded. Restart clears this tool’s local records; delete exported reports separately.')}</p></details><h3 style="margin-top:24px">${T('国际参考资料','International reference materials')}</h3>${sourceLinks()}</div>`}
function guide(){$('app').innerHTML=`<section class="fade"><button class="back" id="guide-back">← ${T('回到我的旅程','Back to my journey')}</button><div class="eyebrow">THE DISC FIELD GUIDE</div><h1 style="font-size:40px">${T('不只四个字母。<br><span class="accent">学会理解差异。</span>','Beyond four letters.<br><span class="accent">Understand the differences.</span>')}</h1><p class="lead">${T('国际培训通常从行为节奏、互动方式和工作优先事项开始，再讨论如何灵活调整。所有风格都有价值，每个人都有四种倾向。','International training explores pace, interaction and work priorities, then develops flexibility. Every style has value and everyone has all four tendencies.')}</p><div class="dimension-grid"><div class="dimension"><b>D</b>${T('较快表达 + 质疑探究','Faster-paced + questioning')}</div><div class="dimension"><b>I</b>${T('较快表达 + 接纳互动','Faster-paced + accepting')}</div><div class="dimension"><b>S</b>${T('谨慎思考 + 接纳互动','Reflective + accepting')}</div><div class="dimension"><b>C</b>${T('谨慎思考 + 质疑探究','Reflective + questioning')}</div></div><p class="small">${T('上述两轴概括 Everything DiSC 的模型；接纳不表示没有判断力，质疑不表示不友善。C 在不同产品中可能称 Conscientiousness 或 Compliance，名称与算法并非完全相同。','These axes summarize Everything DiSC. Accepting does not mean lacking judgment; questioning does not mean unkind. Different products may call C Conscientiousness or Compliance; their names and algorithms are not identical.')}</p><div class="learning-grid"><div class="picker">${P.map((p,j)=>`<button class="pick-style ${learnStyle===j?'active':''}" data-pick="${j}" aria-pressed="${learnStyle===j}">${char(j)}<span><b>${keys[j]} · ${B(p.n)}</b><small>${B(p.role)}</small></span></button>`).join('')}</div><section><div class="learn-title">${char(learnStyle)}<div><div class="eyebrow" style="margin:0">${P[learnStyle].n[1]}</div><h2>${B(P[learnStyle].n)}</h2><span class="small">${B(P[learnStyle].tag)}</span></div></div>${['self','pressure','people','action'].map((k,j)=>`<details ${j===0?'open':''}><summary>${tabItems[j][en?2:1]}</summary><div style="padding-top:17px">${personContent(learnStyle,k)}</div></details>`).join('')}<p class="small" style="margin-top:15px">${T('基础倾向综合自 DiSCprofile 的风格说明；具体话术、管理提醒和练习是本网站编写的应用示例，不是个人诊断。','Basic tendencies are synthesized from DiSCprofile’s descriptions. Scripts, management reminders and exercises are site-authored applications, not individual diagnoses.')}</p><a class="small" href="https://www.discprofile.com/disc-styles/${['dominance','influence','steadiness','conscientiousness'][learnStyle]}" target="_blank" rel="noopener">${T('阅读该风格的参考资料','Read the reference for this style')} ↗</a></section></div><section style="margin-top:40px"><div class="section-head"><h2>${T('混合风格，不是四个盒子。','Blended styles, not four boxes.')}</h2></div><p class="small">${T('Everything DiSC 使用 12 风格圆形模型，下面是概念简介。相邻字母顺序不同，侧重点也不同；这是学习图鉴，不是我们的测评分型算法。','Everything DiSC uses a 12-style circular model. These brief descriptions introduce it. Letter order changes emphasis. This is a learning guide, not this tool’s scoring algorithm.')}</p><div class="blend-grid">${blends.map(b=>`<div class="blend"><b>${b[0]}</b><p>${b[en?2:1]}</p></div>`).join('')}</div></section><div class="panel" style="margin-top:30px"><h3>${T('国际测评体系并不完全相同','Assessment systems are not interchangeable')}</h3><p class="small">${T('Everything DiSC 以圆形位置、优先事项和行为调整来解释结果；TTI 的产品会呈现自然与适应风格。不同工具的分数、图表和研究证据不能互相借用。','Everything DiSC explains circular placement, priorities and flexibility. TTI products include natural and adapted styles. Scores, charts and evidence from different products are not interchangeable.')}</p><p class="small">${T('供应商公开的研究只适用于其自身产品。我们的原创中英双语题库尚未做翻译等值、重测信度、内部一致性或常模研究。增加题目是扩充情境，不是准确度保证。','Vendor research applies to their products. Our original bilingual item bank has no language-equivalence, test–retest, internal-consistency or normative study. More groups broaden contexts; they do not guarantee accuracy.')}</p>${sourceLinks()}</div></section>`;$('guide-back').onclick=()=>go(returnView);document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{learnStyle=+b.dataset.pick;guide()})}
$('language').onclick=()=>{if($('name'))name=$('name').value.trim();en=!en;stash();render()};$('brand').onclick=()=>{if($('name')){name=$('name').value.trim();stash()}go('home')};$('guide-nav').onclick=()=>{if($('name')){name=$('name').value.trim();stash()}openGuide(learnStyle)};
render();
</script></body></html>
