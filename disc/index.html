[['时间紧时，我优先完成关键结果。','Under time pressure, I prioritize the main outcome.'],['时间紧时，我用积极表达鼓励大家。','Under time pressure, I encourage people with energy.'],['时间紧时，我稳定节奏并帮助伙伴。','Under time pressure, I stay steady and help others.'],['时间紧时，我仍会核对关键细节。','Under time pressure, I still check critical details.']],
[['带领项目时，我把责任和目标讲清楚。','I lead projects by clarifying ownership and goals.'],['带领项目时，我描绘愿景来争取支持。','I lead projects by sharing a vision that gains support.'],['带领项目时，我持续跟进团队的需要。','I lead projects by staying attentive to team needs.'],['带领项目时，我建立清晰流程和标准。','I lead projects by creating clear processes and standards.']],
[['学习新工具，我直接动手解决任务。','With a new tool, I dive into a practical task.'],['学习新工具，我喜欢和别人一起探索。','With a new tool, I enjoy exploring with others.'],['学习新工具，我喜欢有人耐心示范。','With a new tool, I appreciate a patient demonstration.'],['学习新工具，我先了解原理和说明。','With a new tool, I first study instructions and logic.']],

[['筹备活动，我着重目标和进度。','For an event, I focus on goals and progress.'],['筹备活动，我着重气氛和参与感。','For an event, I focus on energy and engagement.'],['筹备活动，我着重照顾参与者的需要。','For an event, I focus on participants’ needs.'],['筹备活动，我着重清单和检查流程。','For an event, I focus on checklists and checks.']],

[['合作时，我希望大家敢于承担和决定。','In collaboration, I value ownership and decisiveness.'],['合作时，我希望大家开放交流和分享。','In collaboration, I value open exchange and sharing.'],['合作时，我希望大家互相支持和信任。','In collaboration, I value support and trust.'],['合作时，我希望大家按标准把事情做好。','In collaboration, I value working to clear standards.']]

let en=false,view='home',idx=0,answers=raw.map(()=>({m:null,l:null})),name='',finished=false;
const $=id=>document.getElementById(id),t=(a,b)=>en?b:a,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stash(){try{localStorage.setItem('disc-lab-v1',JSON.stringify({answers,name,idx,finished}));}catch(e){}}
try{const x=JSON.parse(localStorage.getItem('disc-lab-v1'));if(x&&x.answers?.length===raw.length&&x.answers.every(a=>[a.m,a.l].every(v=>v===null||Number.isInteger(v)&&v>=0&&v<4)&&!(a.m!==null&&a.m===a.l))){answers=x.answers;name=typeof x.name==='string'?x.name.slice(0,60):'';idx=Math.max(0,Math.min(15,x.idx||0));finished=x.finished&&answers.every(a=>a.m!==null&&a.l!==null)}}catch(e){}
function render(){document.documentElement.lang=en?'en':'zh-Hans';$('language').textContent=en?'中文 ↗':'English ↗';$('foot').textContent=t('原创自评 · 仅在本机保存 · 非标准化心理测验','Original self-reflection · Saved on this device · Not a standardized assessment');if(view==='home')home();else if(view==='test')test();else report()}
function home(){$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">UNDERSTAND YOUR WAY OF WORKING</div><h1>${t('了解你的行为风格，<br>让合作更有默契。','Know your style.<br>Connect better.')}</h1><p class="lead">${t('你如何决策、表达、协作与分析？从真实的工作情境出发，探索属于你的 DISC 行为倾向。','How do you decide, express, collaborate and analyze? Explore your DISC tendencies through everyday work situations.')}</p><div class="meta">16 ${t('组情境','groups')} / 4–6 ${t('分钟','minutes')} / ${t('中英双语报告','Bilingual report')}</div><label class="subtitle" for="name">${t('报告称呼（可选）','Report name (optional)')}</label><br><input id="name" type="text" maxlength="60" placeholder="${t('你的名字或昵称','Your name or nickname')}" value="${esc(name)}"><div class="actions"><button class="primary" id="start">${t(answers.some(a=>a.m!==null)?'继续探索':'开始探索',answers.some(a=>a.m!==null)?'Continue assessment':'Start exploring')} ↗</button>${finished?`<button class="ghost" id="old">${t('查看报告','View report')}</button>`:''}</div><p class="note">${t('没有标准答案。请选择平时真实的自己，而非理想中的自己。','There are no right answers. Choose your usual behavior, not your ideal self.')}</p></div><div class="wheel">${profiles.map((p,j)=>`<div class="tile ${keys[j].toLowerCase()}"><b>${keys[j]}</b><span>${p[en?1:0]}</span><small>${p[en?3:2]}</small></div>`).join('')}</div></section><section class="steps">${[[t('选择最像与最不像','Choose most & least'),t('每组四句话，选择一项最像你、一项最不像你。','In each group, choose one statement most like you and one least like you.')],[t('看见四项数据','See four dimensions'),t('通过相对倾向指数与图表，理解自己的行为偏好。','Understand your preferences with relative indices and a chart.')],[t('把理解带进合作','Bring insight to teamwork'),t('获得沟通建议、潜在盲点与一项行动练习。','Get communication tips, possible blind spots and a practical action.')]].map((x,j)=>`<div><span class="num">0${j+1}</span><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</section><p class="note">${t('本工具为原创教育用途自评，未经信效度或常模验证；不等同于 123test 或任何官方 DISC 测评。不要作为招聘、诊断或能力评定的唯一依据。','This original educational self-reflection tool has no validation or normative study. It is not 123test or an official DISC assessment. Do not use it as the sole basis for hiring, diagnosis or ability judgments.')}</p>`;$('start').onclick=()=>{name=$('name').value.trim();view='test';stash();render();scrollTo(0,0)};if($('old'))$('old').onclick=()=>{name=$('name').value.trim();view='report';render()}}
function test(){let a=answers[idx],count=answers.filter(a=>a.m!==null&&a.l!==null).length;let order=[0,1,2,3].map((_,j)=>(j+idx)%4);$('app').innerHTML=`<section class="test"><div class="topline"><span>${t('行为风格探索','BEHAVIOUR EXPLORER')}</span><span>${t('已完成','Completed')} ${count} / 16</span></div><div class="progress"><i style="width:${count/16*100}%"></i></div><div class="eyebrow">GROUP ${String(idx+1).padStart(2,'0')} / 16</div><h2>${t('哪句话更像平时的你？','Which sounds most like you?')}</h2><p class="subtitle">${t('各选一项「最像我」和「最不像我」，不能选同一句。','Select one “Most like me” and one “Least like me”. Choose different statements.')}</p><div class="panel"><div class="question-row" style="border:0;min-height:40px"><span class="note">${t('请根据日常行为作答','Think about your usual behavior')}</span><span class="colhead">${t('最像我','Most')}</span><span class="colhead">${t('最不像我','Least')}</span></div>${order.map(j=>`<div class="question-row"><div>${raw[idx][j][en?1:0]}</div>${['m','l'].map(k=>`<label class="choice"><input class="pick" type="radio" name="${k}" value="${j}" aria-label="${esc(raw[idx][j][en?1:0]+' — '+(k==='m'?t('最像我','Most like me'):t('最不像我','Least like me')))}" ${a[k]===j?'checked':''}></label>`).join('')}</div>`).join('')}</div><div class="actions" style="justify-content:space-between"><button class="ghost" id="prev">← ${t(idx?'上一组':'返回首页',idx?'Previous':'Home')}</button><button class="primary" id="next" ${a.m===null||a.l===null?'disabled':''}>${idx===15?t('生成我的报告','See my report'):t('下一组','Next group')} →</button></div><p class="note">${t('进度自动保存在当前浏览器；测试数据不会上传服务器。','Progress is saved in this browser. Assessment data is not uploaded to a server.')}</p></section>`;document.querySelectorAll('.pick').forEach(el=>el.onchange=()=>{a[el.name]=+el.value;let other=el.name==='m'?'l':'m';if(a[other]===+el.value)a[other]=null;finished=false;stash();test()});$('prev').onclick=()=>{if(idx)idx--;else view='home';stash();render()};$('next').onclick=()=>{if(a.m===null||a.l===null)return;if(idx<15){idx++;stash();test()}else{let missing=answers.findIndex(a=>a.m===null||a.l===null);if(missing>=0){idx=missing;test();return}finished=true;view='report';stash();report()}scrollTo(0,0)}}
function score(){let most=[0,0,0,0],least=[0,0,0,0];answers.forEach(a=>{most[a.m]++;least[a.l]++});let net=most.map((v,j)=>v-least[j]);let index=net.map(v=>Math.round((v+16)/32*100));return{most,least,net,index}}
function report(){if(!answers.every(a=>a.m!==null&&a.l!==null)){view='test';test();return}let r=score(),max=Math.max(...r.net),tops=keys.filter((k,j)=>r.net[j]===max),rank=keys.map((k,j)=>j).sort((a,b)=>r.net[b]-r.net[a]),p=profiles[rank[0]],tie=tops.length>1;let title=tie?t('并列倾向','Tied tendencies'):p[en?1:0];$('app').innerHTML=`<div class="results-top"><div><div class="eyebrow">YOUR BEHAVIOUR SNAPSHOT</div><h1 style="font-size:42px">${esc(name)?esc(name)+' · ':''}${t('行为风格报告','Behaviour profile')}</h1><div class="subtitle">${new Date().toLocaleDateString(en?'en-MY':'zh-CN')} · 16 / 16 ${t('组已完成','groups completed')}</div></div><span class="badge">${t('自我探索版','Self-reflection edition')}</span></div><div class="reportgrid"><section class="panel"><div class="eyebrow">DISC PROFILE</div><h2>${t('四项行为倾向指数','Four tendency indices')}</h2>${keys.map((k,j)=>`<div class="barrow"><b style="color:${colors[j]}">${k}</b><div class="track"><div class="fill" style="width:${r.index[j]}%;background:${colors[j]}"></div></div><b>${r.index[j]}</b></div>`).join('')}<p class="note">${t('0–100 相对指数；50 代表最像与最不像次数相同。四项独立，不相加为 100，也不是人群百分位。','Relative indices from 0–100. 50 means equal most/least counts. Scores do not sum to 100 and are not population percentiles.')}</p></section><section class="panel"><div class="eyebrow">${t('本次主要倾向','LEADING TENDENCY')}</div><h2 style="font-size:38px">${tops.join(' / ')} <span style="font-size:20px">${title}</span></h2><p>${tie?t('你的最高净分出现并列，暂不强行归为单一类型。可结合下方各项说明与真实经历理解。','Your highest net scores are tied. A single type is not assigned; consider the descriptions below alongside real experiences.'):p[en?5:4]}</p><h3 style="font-size:15px">${t('沟通与合作建议','Communication & collaboration')}</h3><p class="subtitle">${tie?tops.map(k=>profiles[keys.indexOf(k)][en?7:6]).join(' '):p[en?7:6]}</p><h3 style="font-size:15px">${t('留意的盲点','A possible blind spot')}</h3><p class="subtitle">${tie?t('在不同情境中，你的偏好可能变化；留意何时需要果断、倾听、支持或核实。','Your preferences may shift by context; notice when to decide, listen, support or verify.'):p[en?9:8]}</p></section></div><div class="cards">${profiles.map((p,j)=>`<article class="tile ${keys[j].toLowerCase()}"><b>${keys[j]} <span style="font-size:14px">${p[en?1:0]}</span></b><p>${p[en?5:4]}</p><small>${t('最像','Most')} ${r.most[j]} · ${t('最不像','Least')} ${r.least[j]} · ${t('净分','Net')} ${r.net[j]}</small></article>`).join('')}</div><section class="panel" style="margin-top:24px"><h3>${t('下一次合作，试做一件事','One action for your next collaboration')}</h3><p class="subtitle">${t('找一位熟悉你的伙伴，对照一次真实合作经历：哪一项描述符合你？哪一项不符合？共同约定一个可以实践的沟通调整。','Ask someone who knows you to reflect on a real collaboration: what fits, and what does not? Agree on one practical communication adjustment.')}</p></section><div class="method"><details><summary>${t('分数怎样计算？','How are scores calculated?')}</summary><p class="note">${t('每组四句分别对应 D、I、S、C，顺序轮换。最像 +1，最不像 −1，其余 0。16 组累加，每项净分范围 −16 至 +16；指数 = 四舍五入〔(净分 + 16) ÷ 32 × 100〕。最高净分为主要倾向；同分并列展示。这是本工具的透明规则，不是标准化 DISC 常模算法。','Each group maps one statement to each dimension, with rotating display order. Most = +1, least = −1, others = 0. Net scores range from −16 to +16. Index = round((net + 16) / 32 × 100). Highest net score indicates the leading tendency; ties are shown together. This is a transparent custom rule, not a standardized DISC norm algorithm.')}</p></details><details><summary>${t('如何理解与保护我的数据？','Interpretation & privacy')}</summary><p class="note">${t('原创题目未经信效度验证。结果反映本次自陈选择，会随角色、情境与时间变化；不代表能力、心理诊断或固定人格。仅用于教育、自我反思与团队讨论。名字和答案只保存于此浏览器，清除按钮可删除；下载的报告请自行妥善保管。','Original items are not psychometrically validated. Results reflect current self-reported choices and may change with context, role and time. They are not an ability rating, diagnosis or fixed personality label. Use for education, reflection and team discussion. Name and answers stay in this browser; the clear button deletes them. Keep downloaded reports secure.')}</p></details></div><div class="actions no-print"><button class="primary" id="print">${t('打印 / 保存 PDF','Print / Save PDF')} ↗</button><button class="ghost" id="download">${t('下载数据报告','Download data report')}</button><button class="ghost" id="edit">${t('检查答案','Review answers')}</button><button class="ghost" id="reset">${t('清除并重新测试','Clear & restart')}</button></div>`;$('print').onclick=()=>window.print();$('download').onclick=()=>{const b=new Blob([JSON.stringify({assessment:'DISC LAB original educational self-reflection v1',name,date:new Date().toISOString(),...r,leading:tops,answers,method:'Most +1, least -1; index=round((net+16)/32*100); not normed or validated'},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='DISC-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('edit').onclick=()=>{view='test';idx=0;render();scrollTo(0,0)};$('reset').onclick=()=>{if(confirm(t('删除本机的姓名、答案和报告，重新开始？','Delete this device’s name, answers and report and start again?'))){answers=raw.map(()=>({m:null,l:null}));name='';idx=0;finished=false;try{localStorage.removeItem('disc-lab-v1')}catch(e){}view='home';render();scrollTo(0,0)}}}
